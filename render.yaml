services:
  - type: web
    name: checklist-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REMINDER_CRON
        value: "*/15 * * * *"
      - key: OVERDUE_GRACE_MINUTES
        value: "0"
